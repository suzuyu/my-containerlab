# https://kind.sigs.k8s.io/docs/user/configuration/#nodes
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  ipFamily: dual
  disableDefaultCNI: true # https://docs.cilium.io/en/latest/installation/kind/#configure-kind
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: k8s_kind/node
        containerPath: /scripts
        readOnly: true
  - role: worker
    extraMounts:
      - hostPath: k8s_kind/node
        containerPath: /scripts
        readOnly: true
  - role: worker
    extraMounts:
      - hostPath: k8s_kind/node
        containerPath: /scripts
        readOnly: true

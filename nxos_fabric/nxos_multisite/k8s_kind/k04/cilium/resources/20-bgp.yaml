apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: k04-mesh-api
  labels:
    advertise: k04
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses: [LoadBalancerIP]
      selector:
        matchLabels:
          lb-pool: k04-mesh-api
          dci-export: clustermesh
          io.kubernetes.service.namespace: kube-system
          io.kubernetes.service.name: clustermesh-apiserver
      attributes:
        communities:
          standard: ["65012:514"]
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: k04-direct
spec:
  timers:
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 30
    keepAliveTimeSeconds: 10
  gracefulRestart:
    enabled: false
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: k04
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          advertise: k04
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: k04-workers
spec:
  nodeSelector:
    matchLabels:
      bgp-speaker: "true"
    matchExpressions:
      - key: bgp-maintenance
        operator: DoesNotExist
  bgpInstances:
    - name: k04-65012
      localASN: 65012
      peers:
        - name: adc-bgrt0101-ipv4
          peerASN: 65010
          peerAddress: 172.16.6.4
          peerConfigRef:
            name: k04-direct
        - name: adc-bgrt0101-ipv6
          peerASN: 65010
          peerAddress: fd21:0:0:6::4
          peerConfigRef:
            name: k04-direct
        - name: adc-bgrt0102-ipv4
          peerASN: 65010
          peerAddress: 172.16.6.5
          peerConfigRef:
            name: k04-direct
        - name: adc-bgrt0102-ipv6
          peerASN: 65010
          peerAddress: fd21:0:0:6::5
          peerConfigRef:
            name: k04-direct
---
apiVersion: cilium.io/v2
kind: CiliumBGPNodeConfigOverride
metadata:
  name: adc-k04-worker
spec:
  bgpInstances:
    - name: k04-65012
      routerID: 172.16.6.21
      peers:
        - name: adc-bgrt0101-ipv4
          localAddress: 172.16.6.21
        - name: adc-bgrt0101-ipv6
          localAddress: fd21:0:0:6::2:1
        - name: adc-bgrt0102-ipv4
          localAddress: 172.16.6.21
        - name: adc-bgrt0102-ipv6
          localAddress: fd21:0:0:6::2:1
---
apiVersion: cilium.io/v2
kind: CiliumBGPNodeConfigOverride
metadata:
  name: adc-k04-worker2
spec:
  bgpInstances:
    - name: k04-65012
      routerID: 172.16.6.22
      peers:
        - name: adc-bgrt0101-ipv4
          localAddress: 172.16.6.22
        - name: adc-bgrt0101-ipv6
          localAddress: fd21:0:0:6::2:2
        - name: adc-bgrt0102-ipv4
          localAddress: 172.16.6.22
        - name: adc-bgrt0102-ipv6
          localAddress: fd21:0:0:6::2:2

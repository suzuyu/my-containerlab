apiVersion: v1
kind: Namespace
metadata:
  name: cilium-k04-preflight
  annotations:
    clustermesh.cilium.io/global: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k04-preflight-nginx
  namespace: cilium-k04-preflight
data:
  default.conf: |
    server {
      listen 8080;
      listen [::]:8080;
      access_log /dev/stdout;
      location = /healthz { return 200 "ok\n"; }
      location / { return 200 "cluster=adc-k04 pod=$hostname\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k04-preflight
  namespace: cilium-k04-preflight
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k04-preflight
  template:
    metadata:
      labels:
        app: k04-preflight
        cluster: adc-k04
    spec:
      nodeSelector:
        bgp-speaker: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: k04-preflight
              topologyKey: kubernetes.io/hostname
      containers:
        - name: server
          image: docker.io/library/nginx:1.29.4-alpine@sha256:a60ab79b8d1cbc6c0860ca9829908c5e7e83ed887034e778fc7adf0b1bfe5e47
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: k04-preflight-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: k04-preflight
  namespace: cilium-k04-preflight
  annotations:
    service.cilium.io/global: "false"
    service.cilium.io/shared: "false"
spec:
  type: NodePort
  ipFamilyPolicy: RequireDualStack
  ipFamilies: [IPv4, IPv6]
  externalTrafficPolicy: Cluster
  selector:
    app: k04-preflight
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: k04-client
  namespace: cilium-k04-preflight
spec:
  nodeSelector:
    bgp-speaker: "true"
  containers:
    - name: client
      image: docker.io/curlimages/curl:8.17.0@sha256:43ebaa53d3806db6b1ce4353b6b26ae638ec1c167ee351524b05690f988bb20d
      command: ["sh", "-c", "while true; do sleep 3600; done"]

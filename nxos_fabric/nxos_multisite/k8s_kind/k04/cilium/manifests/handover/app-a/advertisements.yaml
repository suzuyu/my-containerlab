apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: k04-handover-candidate
  labels:
    advertise: k04
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses: [LoadBalancerIP]
      selector:
        matchLabels:
          vip-mode: handover
          lb-pool: k04-handover-app-a
          handover-state: candidate
          io.kubernetes.service.namespace: cilium-upgrade-app-a
          io.kubernetes.service.name: app-a
      attributes:
        communities:
          standard: ["65010:100"]
---

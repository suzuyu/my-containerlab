apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: k02-egress
  labels:
    advertise: k02
spec:
  advertisements:
    - advertisementType: Interface
      interface:
        name: egress0
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: k02-egress-planned-shut
  labels:
    advertise: k02-planned-shut
spec:
  advertisements:
    - advertisementType: Interface
      interface:
        name: egress0
      attributes:
        communities:
          wellKnown:
            - planned-shut

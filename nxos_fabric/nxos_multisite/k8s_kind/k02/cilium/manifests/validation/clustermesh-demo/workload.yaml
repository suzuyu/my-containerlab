apiVersion: v1
kind: Namespace
metadata:
  name: cilium-test
  annotations:
    clustermesh.cilium.io/global: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clustermesh-demo-nginx
  namespace: cilium-test
data:
  default.conf: |
    server {
      listen 8080;
      access_log /dev/stdout;
      location = /healthz { return 200 "ok\n"; }
      location / { return 200 "cluster=adc-k02\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clustermesh-demo
  namespace: cilium-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clustermesh-demo
  template:
    metadata:
      labels:
        app: clustermesh-demo
        cluster: adc-k02
    spec:
      nodeSelector:
        bgp-speaker: "true"
      containers:
        - name: server
          image: docker.io/library/nginx:1.29.4-alpine@sha256:a60ab79b8d1cbc6c0860ca9829908c5e7e83ed887034e778fc7adf0b1bfe5e47
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: clustermesh-demo-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: clustermesh-demo
  namespace: cilium-test
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "true"
    service.cilium.io/affinity: local
spec:
  selector:
    app: clustermesh-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: clustermesh-client
  namespace: cilium-test
  labels:
    app: clustermesh-client
spec:
  containers:
    - name: client
      image: docker.io/curlimages/curl:8.17.0@sha256:43ebaa53d3806db6b1ce4353b6b26ae638ec1c167ee351524b05690f988bb20d
      command: ["sh", "-c", "while true; do sleep 3600; done"]

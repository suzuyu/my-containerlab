apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: k02-loadbalancer-planned-shut
  labels:
    advertise: k02-planned-shut
spec:
  advertisements:
    - advertisementType: Service
      service:
        aggregationLengthIPv4: 26
        aggregationLengthIPv6: 112
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          bgp-advertise: "true"
      attributes:
        communities:
          wellKnown:
            - planned-shut
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          dci-export: clustermesh
      attributes:
        communities:
          standard:
            - "65012:510"
          wellKnown:
            - planned-shut
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: k02-direct-planned-shut
spec:
  timers:
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 30
    keepAliveTimeSeconds: 10
  gracefulRestart:
    enabled: false
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: k02-planned-shut
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          advertise: k02-planned-shut
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: k02-workers-planned-shut
spec:
  nodeSelector:
    matchLabels:
      bgp-speaker: "true"
      bgp-maintenance: planned-shut
  bgpInstances:
    - name: k02-65012
      localASN: 65012
      peers:
        - name: adc-bgrt0101-ipv4
          peerASN: 65010
          peerAddress: 172.16.4.4
          peerConfigRef:
            name: k02-direct-planned-shut
        - name: adc-bgrt0101-ipv6
          peerASN: 65010
          peerAddress: fd21:0:0:4::4
          peerConfigRef:
            name: k02-direct-planned-shut
        - name: adc-bgrt0102-ipv4
          peerASN: 65010
          peerAddress: 172.16.4.5
          peerConfigRef:
            name: k02-direct-planned-shut
        - name: adc-bgrt0102-ipv6
          peerASN: 65010
          peerAddress: fd21:0:0:4::5
          peerConfigRef:
            name: k02-direct-planned-shut

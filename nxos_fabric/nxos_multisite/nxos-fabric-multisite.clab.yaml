name: nxos-fabric-multisite

mgmt:
  network: mgmt-ext
  ipv4-subnet: 192.168.129.0/24
  ipv4-range: 192.168.129.176/28 # multisite
#  ipv4-range: 192.168.129.112/28 # singlesite
  bridge: bridge0

topology:
  kinds:
    cisco_n9kv:
      image: vrnetlab/cisco_n9kv:10.5.4.M.lite
      # startup-config: configs/as-equals/cisco_n9kv/__clabNodeName___run.txt
      # startup-config: configs/as-changes/cisco_n9kv/__clabNodeName___run.txt
      env:
        QEMU_MEMORY: 4608 # 6144 (6G) # Minimum RAM 4.5 G (4608 MB) (basic bootup) 10.5(3)F ~ . Recommended RAM 8G
        QEMU_SMP: 2
        CLAB_MGMT_PASSTHROUGH: "true"
    arista_ceos:
      image: ceos:4.35.4M
      env:
        CLAB_MGMT_VRF: MGMT
      # startup-config: configs/as-equals/arista_ceos/__clabNodeName___run.txt
      startup-config: configs/as-changes/arista_ceos/__clabNodeName___run.txt
    linux:
      image: ghcr.io/hellt/network-multitool:latest
    k8s-kind:
      image: kindest/node:v1.34.3 # Kubernetes Version 指定
  nodes:
    # wan
    ## p
    p01:
      kind: arista_ceos
      mgmt-ipv4: 192.168.129.170
      group: wan
    ## pe
    pe01:
      kind: arista_ceos
      mgmt-ipv4: 192.168.129.161
      group: wan
    pe02:
      kind: arista_ceos
      mgmt-ipv4: 192.168.129.162
      group: wan
    pe03:
      kind: arista_ceos
      mgmt-ipv4: 192.168.129.163
      group: wan
    pe04:
      kind: arista_ceos
      mgmt-ipv4: 192.168.129.164
      group: wan
    # route-server
    adc-rs0101:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.171
      group: rs
      startup-delay: 1800 # 30*60sec
    adc-rs0102:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.172
      group: rs
      startup-delay: 1800 # 30*60sec
    bdc-rs0101:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.173
      group: rs
      startup-delay: 2400 # 40*60sec
    bdc-rs0102:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.174
      group: rs
      startup-delay: 2400 # 40*60sec

    # # internet
    # ## norh-pe
    # internet-pe01:
    #   kind: arista_ceos
    #   mgmt-ipv4: 192.168.129.169
    #   group: internet

    # A DataCenter
    ## bgw
    adc-bgw0101:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.138
      group: bgw
    adc-bgw0102:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.137
      group: bgw
    ## spine
    adc-spsw0101:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.140 # multisite
      # mgmt-ipv4: 192.168.129.90 # singlesite
      group: spine
    adc-spsw0102:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.139 # multisite
      # mgmt-ipv4: 192.168.129.89 # singlesite
      group: spine
    ## leaf
    adc-lfsw0101:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.131 # multisite
      # mgmt-ipv4: 192.168.129.81 # singlesite
      group: leaf
    adc-lfsw0102:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.132 # multisite
      # mgmt-ipv4: 192.168.129.82 # singlesite
      group: leaf
    adc-lfsw0103:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.133 # multisite
      # mgmt-ipv4: 192.168.129.83 # singlesite
      group: leaf
      startup-delay: 600 # 10*60sec
    adc-lfsw0104:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.134 # multisite
      # mgmt-ipv4: 192.168.129.84 # singlesite
      group: leaf
      startup-delay: 600 # 10*60sec
    # ## BorderLeaf
    # adc-blsw0101:
    #   kind: cisco_n9kv
    #   mgmt-ipv4: 192.168.129.135 # multisite
    #   # mgmt-ipv4: 192.168.129.85 # singlesite

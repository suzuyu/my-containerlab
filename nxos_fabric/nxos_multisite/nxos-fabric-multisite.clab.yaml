      startup-delay: 1200 # 20*60sec
    bdc-bgw0102:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.147
      group: bgw
      startup-delay: 1200 # 20*60sec
    ## spine
    bdc-spsw0101:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.150
      group: spine
      startup-delay: 1200 # 20*60sec
    ## leaf
    bdc-lfsw0101:
      kind: cisco_n9kv
      mgmt-ipv4: 192.168.129.141
      group: leaf
      startup-delay: 1200 # 20*60sec
    bdc-lfsw0102:

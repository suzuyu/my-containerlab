configure terminal
ip prefix-list CILIUM_K02_EGRESS_V4 seq 5 permit 172.16.24.0/24 le 32
ipv6 prefix-list CILIUM_K02_EGRESS_V6 seq 5 permit fd21:0:0:24::/64 le 128
route-map CILIUM_K02_IN_V4 permit 30
  match ip address prefix-list CILIUM_K02_EGRESS_V4
route-map CILIUM_K02_IN_V6 permit 30
  match ipv6 address prefix-list CILIUM_K02_EGRESS_V6
router bgp 65010
  vrf tenant1-vpc1
    address-family ipv4 unicast
      aggregate-address 172.16.24.0/24
    address-family ipv6 unicast
      aggregate-address fd21:0:0:24::/64
end

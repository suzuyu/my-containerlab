configure terminal
no route-map UREH_K02_V4
no route-map UREH_K02_V6
no route-map UREH_K04_V4
no route-map UREH_K04_V6
no ip prefix-list UREH_APP_V4
no ipv6 prefix-list UREH_APP_V6
no ip prefix-list UREH_E_V4

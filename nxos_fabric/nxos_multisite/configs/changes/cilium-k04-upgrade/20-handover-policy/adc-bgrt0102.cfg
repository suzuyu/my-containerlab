! REVIEW CANDIDATE ONLY - NOT APPLIED - 2026-09-24
! Target: adc-bgrt0102; baseline: configs/as-changes
! Requires 10-connectivity and existing k02 prefix-lists unchanged; P is the reviewed example only.
! Read ../README.md before any future application. No save command included.
configure terminal
! First prepare exact P + current community on k02 while k04 P remains off.
! These are NEW complete maps; do not edit an attached map entry by entry.
ip prefix-list K04UP_APP_V4 seq 10 permit 172.16.14.20/32
ipv6 prefix-list K04UP_APP_V6 seq 10 permit fd21:0:0:14:0:0:1:100/128
ip community-list standard K04UP_CANDIDATE seq 10 permit 65010:100
ip community-list standard K04UP_CURRENT seq 10 permit 65010:200
ip community-list standard K04UP_PREFERRED seq 10 permit 65010:300
route-map K04UP_K02_V4 permit 1
  match ip address prefix-list K04UP_APP_V4
  match community K04UP_CANDIDATE exact-match
  set local-preference 100
route-map K04UP_K02_V4 permit 2
  match ip address prefix-list K04UP_APP_V4
  match community K04UP_CURRENT exact-match
  set local-preference 200
route-map K04UP_K02_V4 permit 3
  match ip address prefix-list K04UP_APP_V4
  match community K04UP_PREFERRED exact-match
  set local-preference 300
! Reject missing, multiple, unknown or extra standard communities for P.
route-map K04UP_K02_V4 deny 4
  match ip address prefix-list K04UP_APP_V4
route-map K04UP_K02_V4 permit 10
  match ip address prefix-list CILIUM_K02_AGG_V4
route-map K04UP_K02_V4 permit 20
  match ip address prefix-list CILIUM_K02_LB_V4
route-map K04UP_K02_V4 permit 30

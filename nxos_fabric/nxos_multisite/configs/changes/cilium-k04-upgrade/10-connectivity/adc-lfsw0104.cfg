  switchport
  switchport mode trunk
  switchport trunk allowed vlan 16
  mtu 9216
  storm-control broadcast level 40.00
  storm-control action shutdown
  vpc 19
  no shutdown
interface Ethernet1/9
  description adc-k04-control-plane eth2
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 16
  mtu 9216
  lacp rate fast
  storm-control broadcast level 40.00
  storm-control action shutdown
  channel-group 19 mode active
  no shutdown
interface port-channel20
  description adc-k04-worker bond0
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 16
  mtu 9216
  storm-control broadcast level 40.00
  storm-control action shutdown
  vpc 20
  no shutdown
interface Ethernet1/10

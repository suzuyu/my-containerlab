! LAB ADDITION APPLIED - 2026-09-25
! Target: adc-bgrt0101; baseline: configs/as-changes
! Mesh API only at this stage; application P, aggregate, Egress and Pod prefixes are rejected.
! Read ../README.md before any future application. No save command included.
configure terminal
vlan 106
  name tenant1-vpc1-k04-cluster-seg1
interface Vlan106
  description adc-k04 BGP termination
  no shutdown
  mtu 9216
  vrf member tenant1-vpc1
  no ip redirects
  ip address 172.16.6.4/24
  ipv6 address fd21:0:0:6::4/64
  ipv6 nd suppress-ra
  no ipv6 redirects
interface port-channel149
  switchport trunk allowed vlan add 106
! Port-channel149 propagates the VLAN membership to its active member ports.
ip prefix-list K04UP_CM_V4 seq 10 permit 172.16.34.10/32
ipv6 prefix-list K04UP_CM_V6 seq 10 permit fd21:0:0:34:0:0:1:10/128
ip community-list standard K04UP_CM seq 10 permit 65012:514
! Define the entire inbound policy before attaching it.
route-map K04UP_BASE_V4 permit 10
  match ip address prefix-list K04UP_CM_V4
  match community K04UP_CM
route-map K04UP_BASE_V4 deny 1000
route-map K04UP_BASE_V6 permit 10
  match ipv6 address prefix-list K04UP_CM_V6
  match community K04UP_CM
route-map K04UP_BASE_V6 deny 1000
router bgp 65010
  vrf tenant1-vpc1
    neighbor 172.16.6.21
      remote-as 65012
      timers 10 30
      address-family ipv4 unicast
        route-map K04UP_BASE_V4 in
        maximum-prefix 64 restart 30
    neighbor 172.16.6.22
      remote-as 65012
      timers 10 30
      address-family ipv4 unicast
        route-map K04UP_BASE_V4 in
        maximum-prefix 64 restart 30
    neighbor fd21:0:0:6::2:1
      remote-as 65012
      timers 10 30
      address-family ipv6 unicast
        route-map K04UP_BASE_V6 in
        maximum-prefix 64 restart 30
    neighbor fd21:0:0:6::2:2
      remote-as 65012
      timers 10 30
      address-family ipv6 unicast
        route-map K04UP_BASE_V6 in
        maximum-prefix 64 restart 30
end

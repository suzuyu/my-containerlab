! LAB ADDITION APPLIED - 2026-09-25
! Target: adc-lfsw0102; baseline: configs/as-changes
! Assumes the proposed ports/port-channels/VLAN/VNI are unused; topology links are not created here.
! Read ../README.md before any future application. No save command included.
configure terminal
vlan 106
  name tenant1-vpc1-k04-cluster-seg1
  vn-segment 10106
interface Vlan106
  description tenant1-vpc1-k04-cluster-seg1
  no shutdown
  mtu 9216
  vrf member tenant1-vpc1
  no ip redirects
  ip address 172.16.6.1/24
  ipv6 address fd21:0:0:6::1/64
  ipv6 nd suppress-ra
  no ipv6 redirects
  fabric forwarding mode anycast-gateway
vrf context tenant1-vpc1
  ipv6 route fd21:0:0:6::/64 Vlan106
interface nve1
  member vni 10106
evpn
  vni 10106 l2
    rd auto
    route-target import auto
    route-target export auto
interface port-channel19
  description adc-k04-worker2 bond0
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 106
  mtu 9216
  storm-control broadcast level 40.00
  storm-control action shutdown
  vpc 19
  no shutdown
interface Ethernet1/9
  description adc-k04-worker2 eth2
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 106
  mtu 9216
  lacp rate fast
  storm-control broadcast level 40.00
  storm-control action shutdown
  channel-group 19 mode active
  no shutdown
! Preserve existing VLANs 103/104; use additive trunk membership.
interface port-channel149
  switchport trunk allowed vlan add 106
! Port-channel149 propagates the VLAN membership to its active member ports.
end

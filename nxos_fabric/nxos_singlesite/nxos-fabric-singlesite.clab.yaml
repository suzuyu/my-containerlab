        IP_CIDR: "172.16.4.21/24"
        DEF_GW: "172.16.4.1"
        IPV6_CIDR: "fd21:0:0:4::2:1/64"
        DEF_GW6: "fd21:0:0:4::1"
        MTU: "9000"
        SET_DEFAULT_ROUTE: "false"
      exec:
        - |
          sh -lc '
            export VLAN_ID="14";
            export IP_CIDR="172.16.4.21/24";
            export DEF_GW="172.16.4.1";
            export IPV6_CIDR="fd21:0:0:4::2:1/64";
            export DEF_GW6="fd21:0:0:4::1";
            export MTU="9000";
            export SET_DEFAULT_ROUTE="false";

            export ROUTES4="172.16.0.0/16 via 172.16.4.1";
            export ROUTES6="fd21:0:0::/48 via fd21:0:0:4::1";

            ls -l /scripts || true;
            /scripts/init-bond-singlevlan-route.sh
          '

    adc-k02-worker2:
      kind: ext-container
      binds:
        - k8s_kind/node:/scripts:ro
      exec:
        - |
          sh -lc '
            export VLAN_ID="104";
            export IP_CIDR="172.16.4.22/24";
            export DEF_GW="172.16.4.1";
            export IPV6_CIDR="fd21:0:0:4::2:2/64";
            export DEF_GW6="fd21:0:0:4::1";
            export MTU="9000";
            export SET_DEFAULT_ROUTE="false";

            export ROUTES4="172.16.0.0/16 via 172.16.4.1";
            export ROUTES6="fd21:0:0::/48 via fd21:0:0:4::1";

            ls -l /scripts || true;
            /scripts/init-bond-singlevlan-route.sh
          '

apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: tetragon-lab-file
  namespace: cilium-lab-policy
spec:
  podSelector:
    matchLabels:
      app: tetragon-probe
  kprobes:
    - call: security_file_permission
      syscall: false
      return: true
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      returnArg:
        index: 0
        type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - /tmp/tetragon-lab-write
            - index: 1
              operator: Mask
              values:
                - "6"

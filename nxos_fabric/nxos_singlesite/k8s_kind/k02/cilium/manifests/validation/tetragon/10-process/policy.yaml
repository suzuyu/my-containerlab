apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: tetragon-lab-process-exec
  namespace: cilium-lab-policy
spec:
  podSelector:
    matchLabels:
      app: tetragon-probe
  lists:
    - name: exec-syscalls
      type: syscalls
      values:
        - sys_execve
        - sys_execveat
  tracepoints:
    - subsystem: raw_syscalls
      event: sys_enter
      args:
        # Lab kernel format includes common_preempt_lazy_count before id.
        # Recheck raw_syscalls/sys_enter/format when changing the host kernel.
        - index: 5
          type: syscall64
      selectors:
        - matchArgs:
            - index: 0
              operator: InMap
              values:
                - list:exec-syscalls

apiVersion: v1
kind: Namespace
metadata:
  name: egress-probe
---
apiVersion: v1
kind: Pod
metadata:
  name: selected
  namespace: egress-probe
  labels:
    app: egress-probe
    lab.cilium.io/egress-policy: selected
spec:
  # gw-a (worker) と異なる Node からの redirect を必ず確認する。
  nodeSelector:
    kubernetes.io/hostname: adc-k02-worker2
  containers:
    - name: client
      image: docker.io/curlimages/curl:8.17.0@sha256:43ebaa53d3806db6b1ce4353b6b26ae638ec1c167ee351524b05690f988bb20d
      command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: v1
kind: Pod
metadata:
  name: unselected
  namespace: egress-probe
  labels:
    app: egress-probe
    lab.cilium.io/egress-policy: unselected
spec:
  nodeSelector:
    kubernetes.io/hostname: adc-k02-worker2
  containers:
    - name: client
      image: docker.io/curlimages/curl:8.17.0@sha256:43ebaa53d3806db6b1ce4353b6b26ae638ec1c167ee351524b05690f988bb20d
      command: ["sh", "-c", "while true; do sleep 3600; done"]

apiVersion: v1
kind: Namespace
metadata:
  name: cilium-lab-policy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tiefighter-sa
  namespace: cilium-lab-policy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xwing-sa
  namespace: cilium-lab-policy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deathstar-nginx
  namespace: cilium-lab-policy
data:
  default.conf: |
    server {
      listen 8080;
      access_log /dev/stdout;
      location = /healthz { return 200 "ok\n"; }
      location = /v1/request-landing { return 200 "landing accepted\n"; }
      location / { return 200 "deathstar\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deathstar
  namespace: cilium-lab-policy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deathstar
  template:
    metadata:
      labels:
        app: deathstar
        org: empire
        class: deathstar
    spec:
      nodeSelector:
        bgp-speaker: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: deathstar
              topologyKey: kubernetes.io/hostname
      containers:
        - name: deathstar
          image: docker.io/library/nginx:1.29.4-alpine@sha256:a60ab79b8d1cbc6c0860ca9829908c5e7e83ed887034e778fc7adf0b1bfe5e47
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: deathstar-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: deathstar
  namespace: cilium-lab-policy
spec:
  selector:
    app: deathstar
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: tiefighter
  namespace: cilium-lab-policy
  labels:
    app: tiefighter
    org: empire
    class: tiefighter
spec:
  serviceAccountName: tiefighter-sa
  containers:
    - name: client
      image: docker.io/curlimages/curl:8.17.0@sha256:43ebaa53d3806db6b1ce4353b6b26ae638ec1c167ee351524b05690f988bb20d
      command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: v1
kind: Pod
metadata:
  name: xwing
  namespace: cilium-lab-policy
  labels:
    app: xwing
    org: alliance
    class: xwing
spec:
  serviceAccountName: xwing-sa
  containers:
    - name: client
      image: docker.io/curlimages/curl:8.17.0@sha256:43ebaa53d3806db6b1ce4353b6b26ae638ec1c167ee351524b05690f988bb20d
      command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: v1
kind: Pod
metadata:
  name: tetragon-probe
  namespace: cilium-lab-policy
  labels:
    app: tetragon-probe
spec:
  serviceAccountName: xwing-sa
  containers:
    - name: probe
      image: docker.io/curlimages/curl:8.17.0@sha256:43ebaa53d3806db6b1ce4353b6b26ae638ec1c167ee351524b05690f988bb20d
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: scratch
          mountPath: /tmp
  volumes:
    - name: scratch
      emptyDir: {}

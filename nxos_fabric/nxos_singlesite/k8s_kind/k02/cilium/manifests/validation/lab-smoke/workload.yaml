metadata:
  name: lab-smoke-nodeport
  namespace: cilium-lab-smoke
  labels:
    app.kubernetes.io/name: lab-smoke
    app.kubernetes.io/component: service
spec:
  type: NodePort
  ipFamilyPolicy: RequireDualStack
  ipFamilies:
    - IPv4
    - IPv6
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: lab-smoke
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: lab-smoke-nodeport-local
  namespace: cilium-lab-smoke
  labels:
    app.kubernetes.io/name: lab-smoke

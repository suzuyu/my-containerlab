apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-smoke-nginx
  namespace: cilium-lab-smoke
  labels:
    app.kubernetes.io/name: lab-smoke
    app.kubernetes.io/component: backend
data:
  default.conf: |
    server {
      listen 8080;
      listen [::]:8080;
      access_log /dev/stdout;
      location = /healthz { return 200 "ok\n"; }
      location / { return 200 "$hostname\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-smoke
  namespace: cilium-lab-smoke
  labels:
    app.kubernetes.io/name: lab-smoke
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-smoke
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-smoke
        app.kubernetes.io/component: backend
        cilium-lab/role: server
    spec:
      nodeSelector:
        bgp-speaker: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: lab-smoke
                  app.kubernetes.io/component: backend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: server
          image: docker.io/library/nginx:1.29.4-alpine@sha256:a60ab79b8d1cbc6c0860ca9829908c5e7e83ed887034e778fc7adf0b1bfe5e47
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: lab-smoke-nginx
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lab-smoke
  namespace: cilium-lab-smoke
  labels:
    app.kubernetes.io/name: lab-smoke
    app.kubernetes.io/component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-smoke
      app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Pod
metadata:
  name: lab-smoke-client
  namespace: cilium-lab-smoke
  labels:
    app.kubernetes.io/name: lab-smoke
    app.kubernetes.io/component: client
    cilium-lab/role: client
spec:
  nodeSelector:
    bgp-speaker: "true"
  containers:
    - name: client
      image: docker.io/curlimages/curl:8.17.0@sha256:43ebaa53d3806db6b1ce4353b6b26ae638ec1c167ee351524b05690f988bb20d
      command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: lab-smoke-clusterip
  namespace: cilium-lab-smoke
  labels:
    app.kubernetes.io/name: lab-smoke
    app.kubernetes.io/component: service
spec:
  ipFamilyPolicy: RequireDualStack
  ipFamilies:
    - IPv4
    - IPv6
  selector:
    app.kubernetes.io/name: lab-smoke
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
---

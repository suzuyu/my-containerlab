spec:
  type: NodePort
  ipFamilyPolicy: RequireDualStack
  ipFamilies:
    - IPv4
    - IPv6
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: lab-smoke
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: lab-smoke-lb-cluster
  namespace: cilium-lab-smoke
  labels:
    app.kubernetes.io/name: lab-smoke
    app.kubernetes.io/component: service
    lb-pool: app
    bgp-advertise: "true"
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/bgp-control-plane

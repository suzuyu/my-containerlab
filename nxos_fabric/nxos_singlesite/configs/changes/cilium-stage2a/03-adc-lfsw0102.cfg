configure terminal
interface port-channel149
  description adc-bgrt0102 po149
  switchport trunk allowed vlan 103,104
router bgp 65001
  graceful-shutdown aware
  vrf tenant1-vpc1
    neighbor fd21::1:2
      remote-as 65010
      address-family ipv6 unicast
        send-community
    neighbor 172.16.254.2
      remote-as 65010
      address-family ipv4 unicast
        send-community
end
